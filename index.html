<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Счётчик калорий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg0: #0b1220;
    --bg1: #0b1f19;
    --text: rgba(255,255,255,0.92);
    --muted: rgba(255,255,255,0.62);
    --line: rgba(255,255,255,0.10);
    --glass: rgba(255,255,255,0.08);
    --glass2: rgba(255,255,255,0.12);
    --shadow: 0 24px 70px rgba(0,0,0,0.55);
    --shadow-soft: 0 10px 30px rgba(0,0,0,0.35);
    --brand: #22c55e;
    --brand2: #34d399;
    --danger: #fb7185;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(1200px 700px at 15% 10%, rgba(34,197,94,0.16), transparent 55%),
      radial-gradient(1000px 700px at 85% 20%, rgba(16,185,129,0.12), transparent 55%),
      radial-gradient(900px 700px at 70% 85%, rgba(148,163,184,0.10), transparent 55%),
      linear-gradient(160deg, var(--bg0), var(--bg1));
    padding: 34px;
    color: var(--text);
    overflow-x: hidden;
  }
  body::before{
    content:"";
    position: fixed;
    inset: -60px;
    background:
      radial-gradient(closest-side at 20% 30%, rgba(34,197,94,0.14), transparent 60%),
      radial-gradient(closest-side at 75% 25%, rgba(59,130,246,0.12), transparent 58%),
      radial-gradient(closest-side at 55% 80%, rgba(16,185,129,0.10), transparent 58%);
    filter: blur(32px);
    opacity: 0.7;
    pointer-events: none;
    z-index: -1;
  }
  ::selection{ background: rgba(34,197,94,0.28); }
  a{ color: inherit; }
  .app {
    max-width: 960px;
    margin: auto;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.06));
    border: 1px solid var(--line);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 28px 28px 22px;
    border-radius: 24px;
    box-shadow: var(--shadow);
    position: relative;
  }
  .app::after{
    content:"";
    position:absolute;
    inset: 0;
    border-radius: 24px;
    pointer-events:none;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0) 38%),
      linear-gradient(315deg, rgba(34,197,94,0.10), rgba(255,255,255,0) 40%);
    mix-blend-mode: overlay;
    opacity: 0.6;
  }
  h1 {
    text-align: center;
    margin: 0 0 8px;
    font-size: 34px;
    letter-spacing: -0.02em;
  }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 22px; line-height: 1.45; }
  .form {
    display: grid;
    grid-template-columns: 1.8fr 0.8fr auto;
    gap: 12px;
    align-items: start;
    margin-bottom: 20px;
  }
  .field { position: relative; }
  input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    outline: none;
    font-size: 16px;
    background: rgba(10,16,24,0.55);
    color: var(--text);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  input::placeholder{ color: rgba(255,255,255,0.42); }
  input:hover{ border-color: rgba(255,255,255,0.18); }
  input:focus {
    border-color: rgba(34,197,94,0.60);
    box-shadow:
      0 0 0 4px rgba(34,197,94,0.18),
      0 12px 30px rgba(0,0,0,0.35);
    background: rgba(10,16,24,0.70);
    transform: translateY(-1px);
  }
  button {
    border: none;
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: rgba(255,255,255,0.92);
    background: linear-gradient(180deg, rgba(34,197,94,0.95), rgba(22,163,74,0.90));
    box-shadow: 0 10px 26px rgba(34,197,94,0.18), 0 10px 26px rgba(0,0,0,0.30);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease, background .18s ease;
    will-change: transform;
  }
  button:hover { transform: translateY(-1px); filter: brightness(1.06); }
  button:active { transform: translateY(0px) scale(0.99); }
  .btn-clear {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.86);
    border: 1px solid rgba(255,255,255,0.16);
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: none;
  }
  .btn-clear:hover {
    background: rgba(255,255,255,0.10);
    border-color: rgba(255,255,255,0.22);
    transform: translateY(-1px);
  }
  .suggestions {
    position: absolute;
    left: 0;
    right: 0;
    top: 56px;
    z-index: 10;
    background: rgba(16,24,34,0.78);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-soft);
    max-height: 300px;
    overflow-y: auto;
  }
  .suggestion {
    padding: 13px 15px;
    border-bottom: 1px solid rgba(255,255,255,0.10);
    cursor: pointer;
    transition: transform .18s ease, background .18s ease, padding .18s ease;
  }
  .suggestion:hover { background: rgba(34,197,94,0.12); padding-left: 22px; }
  .suggestion strong { display: block; }
  .suggestion small { color: rgba(255,255,255,0.62); }
  .summary {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin: 22px 0 0;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .box {
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.06));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 16px;
    text-align: center;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
  }
  .box span {
    display: block;
    font-size: 24px;
    font-weight: 800;
    margin-top: 6px;
    color: rgba(255,255,255,0.92);
    letter-spacing: -0.02em;
  }
  .list-section {
    margin-top: 24px;
    padding-top: 8px;
  }
  .list-section::before {
    content: "";
    display: block;
    height: 3px;
    margin: 0 0 20px;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, rgba(34,197,94,0.55), rgba(59,130,246,0.28), transparent);
  }
  .panel-title { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top: 0; flex-wrap: wrap; }
  .panel-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-left: auto; }
  .hint { color: var(--muted); font-size:14px; }
  .item {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 10px;
    box-shadow: 0 14px 38px rgba(0,0,0,0.30);
    transform: translateY(0);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
  }
  .item:hover{
    transform: translateY(-1px);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 18px 50px rgba(0,0,0,0.38);
    background: rgba(255,255,255,0.075);
  }
  .item b { font-size: 18px; }
  .meta { color: rgba(255,255,255,0.70); margin-top: 6px; line-height: 1.6; }
  .delete {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.70);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 8px 11px;
    min-width: 40px;
    font-size: 18px;
    line-height: 1;
    font-weight: 600;
    align-self: center;
    border-radius: 12px;
    box-shadow: none;
  }
  .delete:hover {
    background: rgba(251,113,133,0.12);
    color: rgba(255,255,255,0.88);
    border-color: rgba(251,113,133,0.35);
    transform: translateY(-1px);
  }
  .empty { text-align:center; color: var(--muted); padding:24px; border:1px dashed rgba(255,255,255,0.18); border-radius:18px; background: rgba(255,255,255,0.04); }
  .notfound { margin-top: 8px; color: rgba(251,191,36,0.92); font-size:14px; line-height: 1.45; }
  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
  @media (max-width: 760px) {
    body { padding: 14px; }
    .form { grid-template-columns: 1fr; }
    .summary { grid-template-columns: repeat(2, 1fr); }
    h1 { font-size: 28px; }
    .panel-actions { margin-left: 0; width: 100%; justify-content: flex-start; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>🥗 Счётчик калорий</h1>
  <div class="subtitle">Автопоиск по встроенной базе продуктов. Введи продукт, выбери подсказку и укажи граммы.</div>

  <div class="form">
    <div class="field">
      <input id="name" placeholder="Начни писать: огурец, хлеб, молоко..." autocomplete="off" oninput="showSuggestions()" onkeydown="handleEnter(event)" />
      <div id="suggestions" class="suggestions"></div>
      <div id="notfound" class="notfound"></div>
    </div>
    <input id="grams" type="number" min="1" placeholder="Граммы" onkeydown="handleEnter(event)" />
    <button type="button" onclick="addItem()">Добавить</button>
  </div>

  <div class="summary">
    <div class="box">Продуктов<span id="totalItems">0</span></div>
    <div class="box">Ккал<span id="totalCalories">0</span></div>
    <div class="box">Белки<span id="totalProtein">0 г</span></div>
    <div class="box">Жиры<span id="totalFat">0 г</span></div>
    <div class="box">Углеводы<span id="totalCarbs">0 г</span></div>
  </div>

  <div class="list-section">
    <div class="panel-title">
      <h2>Список блюд и продуктов</h2>
      <div class="panel-actions">
        <span class="hint">Данные примерные, на 100 г</span>
        <button type="button" class="btn-clear" onclick="clearAll()">Очистить всё</button>
      </div>
    </div>
    <div id="list"></div>
  </div>
</div>

let items = [];
let selectedName = "";
function saveDraft(){
  try {
    const name = document.getElementById("name")?.value ?? "";
    const grams = document.getElementById("grams")?.value ?? "";
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ name, grams, selectedName }));
  } catch(e) {}
}
function loadDraft(){
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || typeof d !== "object") return;
    if(typeof d.name === "string") document.getElementById("name").value = d.name;
    if(typeof d.grams === "string" || typeof d.grams === "number") document.getElementById("grams").value = String(d.grams);
    if(typeof d.selectedName === "string") selectedName = d.selectedName;
  } catch(e) {}
}
function normalize(str){ return str.trim().toLowerCase().replace(/ё/g,"е"); }
function loadItems(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) return;
    items = parsed.filter(it =>
      it && typeof it.name === "string" && foodDB[it.name] &&
      typeof it.grams === "number" && it.grams > 0 &&
      typeof it.calories === "number" && typeof it.protein === "number" &&
      typeof it.fat === "number" && typeof it.carbs === "number"
    );
  } catch(e) { items = []; }
}
function persistItems(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch(e) {}
}
function findExactProduct(input){
  const n = normalize(input);
  if(!n) return null;
  return Object.keys(foodDB).find(k => normalize(k) === n) || null;
}
function resolveProductKey(typed){
  const t = normalize(typed);
  if(selectedName && foodDB[selectedName] && normalize(selectedName) === t) return selectedName;
  return findExactProduct(typed);
}
function showSuggestions(){
  const input = normalize(document.getElementById("name").value);
  const box = document.getElementById("suggestions");
  const nf = document.getElementById("notfound");
  box.innerHTML = ""; nf.textContent = ""; selectedName = "";
  saveDraft();
  if(input.length < 1) return;
  const keys = Object.keys(foodDB);
  const matches = keys.filter(k => normalize(k).includes(input)).slice(0, 12);
  if(matches.length === 0){ nf.textContent = "Пока нет в базе. Можно добавить этот продукт в foodDB в коде."; return; }
  matches.forEach(name => {
    const d = foodDB[name];
    const div = document.createElement("div");
    div.className = "suggestion";
    div.innerHTML = `<strong>${name}</strong><small>${d.cal} ккал · Б ${d.p} · Ж ${d.f} · У ${d.c} / 100 г</small>`;
    div.onclick = () => selectProduct(name);
    box.appendChild(div);
  });
}
function selectProduct(name){
  selectedName = name;
  document.getElementById("name").value = name;
  document.getElementById("suggestions").innerHTML = "";
  document.getElementById("notfound").textContent = "";
  saveDraft();
  document.getElementById("grams").focus();
}
function addItem(){
  const nf = document.getElementById("notfound");
  const typed = document.getElementById("name").value;
  const grams = Number(document.getElementById("grams").value);
  nf.textContent = "";
  saveDraft();
  if(!grams || grams <= 0){
    nf.textContent = "Укажи количество граммов больше нуля.";
    return;
  }
  const key = resolveProductKey(typed);
  if(!key){
    nf.textContent = "Точного совпадения с базой нет. Начни вводить название и выбери продукт из подсказки или введи его точно, как в списке.";
    return;
  }
  const d = foodDB[key];
  const factor = grams / 100;
  items.push({
    name: key, grams,
    calories: Math.round(d.cal * factor),
    protein: +(d.p * factor).toFixed(1),
    fat: +(d.f * factor).toFixed(1),
    carbs: +(d.c * factor).toFixed(1)
  });
  document.getElementById("name").value = "";
  document.getElementById("grams").value = "";
  selectedName = "";
  document.getElementById("suggestions").innerHTML = "";
  nf.textContent = "";
  saveDraft();
  render();
}
function deleteItem(i){ items.splice(i, 1); render(); }
function clearAll(){
  if(!confirm("Очистить весь список? Данные будут удалены из сохранения.")) return;
  items = [];
  try { localStorage.removeItem(DRAFT_KEY); } catch(e) {}
  render();
}
function handleEnter(e){ if(e.key === "Enter") addItem(); }
function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  let tc = 0, tp = 0, tf = 0, tcar = 0;
  items.forEach((it, i) => {
    tc += it.calories; tp += it.protein; tf += it.fat; tcar += it.carbs;
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<div><b>${it.name}</b> — ${it.grams} г<div class="meta">${it.calories} ккал · Белки ${it.protein} г · Жиры ${it.fat} г · Углеводы ${it.carbs} г</div></div><button type="button" class="delete" onclick="deleteItem(${i})" title="Удалить" aria-label="Удалить из списка">✕</button>`;
    list.appendChild(div);
  });
  if(items.length === 0) list.innerHTML = "<div class=\"empty\">Пока ничего не добавлено. Начни с огурца — он парень скромный, но полезный.</div>";
  document.getElementById("totalItems").textContent = items.length;
  document.getElementById("totalCalories").textContent = Math.round(tc);
  document.getElementById("totalProtein").textContent = tp.toFixed(1) + " г";
  document.getElementById("totalFat").textContent = tf.toFixed(1) + " г";
  document.getElementById("totalCarbs").textContent = tcar.toFixed(1) + " г";
  persistItems();
}
loadItems();
loadDraft();
document.getElementById("name").addEventListener("input", saveDraft);
document.getElementById("grams").addEventListener("input", saveDraft);
render();
</script>
