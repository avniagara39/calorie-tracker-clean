<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Дневник питания</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg0: #0b1220;
    --bg1: #0b1f19;
    --text: rgba(255,255,255,0.92);
    --muted: rgba(255,255,255,0.70);
    --accent: #7FE36A;
    --accent-glow: rgba(127, 227, 106, 0.42);
    --line: rgba(255,255,255,0.10);
    --glass: rgba(255,255,255,0.08);
    --glass2: rgba(255,255,255,0.12);
    --shadow: 0 24px 70px rgba(0,0,0,0.55);
    --shadow-soft: 0 10px 30px rgba(0,0,0,0.35);
    --brand: #22c55e;
    --brand2: #34d399;
    --danger: #fb7185;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(1200px 700px at 15% 10%, rgba(34,197,94,0.16), transparent 55%),
      radial-gradient(1000px 700px at 85% 20%, rgba(16,185,129,0.12), transparent 55%),
      radial-gradient(900px 700px at 70% 85%, rgba(148,163,184,0.10), transparent 55%),
      linear-gradient(160deg, var(--bg0), var(--bg1));
    padding: 34px;
    color: var(--text);
    overflow-x: hidden;
  }
  body::before{
    content:"";
    position: fixed;
    inset: -60px;
    background:
      radial-gradient(closest-side at 20% 30%, rgba(34,197,94,0.14), transparent 60%),
      radial-gradient(closest-side at 75% 25%, rgba(59,130,246,0.12), transparent 58%),
      radial-gradient(closest-side at 55% 80%, rgba(16,185,129,0.10), transparent 58%);
    filter: blur(32px);
    opacity: 0.7;
    pointer-events: none;
    z-index: -1;
  }
  ::selection{ background: rgba(34,197,94,0.28); }
  a{ color: inherit; }
  .app {
    max-width: 960px;
    margin: auto;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.06));
    border: 1px solid var(--line);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 28px 28px 22px;
    border-radius: 24px;
    box-shadow: var(--shadow);
    position: relative;
  }
  .app::after{
    content:"";
    position:absolute;
    inset: 0;
    border-radius: 24px;
    pointer-events:none;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0) 38%),
      linear-gradient(315deg, rgba(34,197,94,0.10), rgba(255,255,255,0) 40%);
    mix-blend-mode: overlay;
    opacity: 0.6;
  }
  .field { position: relative; }
  input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    outline: none;
    font-size: 16px;
    background: rgba(10,16,24,0.55);
    color: var(--text);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  input::placeholder{ color: rgba(255,255,255,0.42); }
  input:hover{ border-color: rgba(255,255,255,0.18); }
  input:focus {
    border-color: rgba(34,197,94,0.60);
    box-shadow:
      0 0 0 4px rgba(34,197,94,0.18),
      0 12px 30px rgba(0,0,0,0.35);
    background: rgba(10,16,24,0.70);
    transform: translateY(-1px);
  }
  button {
    border: none;
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: rgba(255,255,255,0.92);
    background: linear-gradient(180deg, rgba(34,197,94,0.95), rgba(22,163,74,0.90));
    box-shadow: 0 10px 26px rgba(34,197,94,0.18), 0 10px 26px rgba(0,0,0,0.30);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease, background .18s ease;
    will-change: transform;
  }
  button:hover { transform: translateY(-1px); filter: brightness(1.06); }
  button:active { transform: translateY(0px) scale(0.99); }
  .btn-clear {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.86);
    border: 1px solid rgba(255,255,255,0.16);
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: none;
  }
  .btn-clear:hover {
    background: rgba(255,255,255,0.10);
    border-color: rgba(255,255,255,0.22);
    transform: translateY(-1px);
  }
  .suggestions {
    position: absolute;
    left: 0;
    right: 0;
    top: 56px;
    z-index: 10;
    background: rgba(16,24,34,0.78);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-soft);
    max-height: 300px;
    overflow-y: auto;
  }
  .suggestion {
    padding: 13px 15px;
    border-bottom: 1px solid rgba(255,255,255,0.10);
    cursor: pointer;
    transition: transform .18s ease, background .18s ease, padding .18s ease;
  }
  .suggestion:hover { background: rgba(34,197,94,0.12); padding-left: 22px; }
  .suggestion strong { display: block; }
  .suggestion small { color: rgba(255,255,255,0.62); }
  .summary {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin: 22px 0 0;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .box {
    background: linear-gradient(180deg, rgba(255,255,255,0.11), rgba(255,255,255,0.07));
    border: 1px solid rgba(127, 227, 106, 0.08);
    border-radius: 18px;
    padding: 16px;
    text-align: center;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
  }
  .box span {
    display: block;
    font-size: 24px;
    font-weight: 800;
    margin-top: 6px;
    color: rgba(255,255,255,0.92);
    letter-spacing: -0.02em;
  }
  .meta { color: rgba(255,255,255,0.70); margin-top: 6px; line-height: 1.6; }
  .delete {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.70);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 8px 11px;
    min-width: 40px;
    font-size: 18px;
    line-height: 1;
    font-weight: 600;
    align-self: center;
    border-radius: 12px;
    box-shadow: none;
  }
  .delete:hover {
    background: rgba(251,113,133,0.12);
    color: rgba(255,255,255,0.88);
    border-color: rgba(251,113,133,0.35);
    transform: translateY(-1px);
  }
  .notfound { margin-top: 8px; color: rgba(251,191,36,0.92); font-size:14px; line-height: 1.45; }
  .diary-section {
    margin-bottom: 0;
    padding-bottom: 0;
  }
  .app-title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 0 0 18px;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-align: center;
    line-height: 1.1;
  }
  .app-title-icon {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: auto;
    height: auto;
    line-height: 1;
    background: none;
    border: none;
    box-shadow: none;
    border-radius: 0;
  }
  .app-title-icon::after {
    content: "";
    position: absolute;
    left: 52%;
    top: 45%;
    width: 26%;
    height: 26%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(127, 227, 106, 0.75) 0%, rgba(52, 211, 153, 0.38) 42%, transparent 72%);
    filter: blur(7px);
    pointer-events: none;
    z-index: 0;
  }
  .app-title-icon-img {
    position: relative;
    z-index: 1;
    width: 118px;
    height: 118px;
    max-width: 118px;
    object-fit: contain;
    display: block;
    flex-shrink: 0;
    background: transparent;
    border: none;
    box-shadow: none;
    filter: none;
  }
  .app-title-text {
    max-width: 100%;
    align-self: center;
  }
  .diary-controls {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto auto;
    gap: 8px;
    align-items: stretch;
    margin-bottom: 16px;
  }
  .diary-controls > button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 44px;
    padding: 10px 14px;
    font-size: 14px;
    white-space: nowrap;
    width: auto;
    max-width: max-content;
  }
  .diary-controls > button:not(.btn-clear) {
    box-shadow:
      0 10px 26px rgba(34,197,94,0.22),
      0 0 18px rgba(52,211,153,0.14);
  }
  .diary-controls .btn-clear {
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
  }
  .diary-controls > button:nth-child(3) {
    padding: 10px 11px;
    font-size: 12px;
  }
  .diary-controls > button:nth-child(4) {
    padding: 10px 9px;
    font-size: 12px;
  }
  .btn-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: currentColor;
  }
  .btn-icon svg {
    width: 16px;
    height: 16px;
    display: block;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .btn-label-short { display: none; }
  .copy-diary-toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(16px);
    max-width: min(520px, calc(100vw - 32px));
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid rgba(34,197,94,0.35);
    background: rgba(16,24,34,0.92);
    color: rgba(255,255,255,0.92);
    font-size: 14px;
    line-height: 1.45;
    box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
    z-index: 1200;
  }
  .copy-diary-toast.is-visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .share-diary-modal {
    position: fixed;
    inset: 0;
    z-index: 1300;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .share-diary-modal.is-open { display: flex; }
  .share-diary-modal-panel {
    width: min(420px, 100%);
    padding: 22px 20px 18px;
    border-radius: 18px;
    border: 1px solid rgba(127, 227, 106, 0.14);
    background: linear-gradient(180deg, rgba(22,32,28,0.98), rgba(16,24,34,0.98));
    box-shadow: 0 18px 48px rgba(0,0,0,0.45);
  }
  .share-diary-modal-title {
    margin: 0 0 8px;
    font-size: 18px;
    font-weight: 700;
    color: rgba(255,255,255,0.94);
    letter-spacing: -0.01em;
  }
  .share-diary-modal-hint {
    margin: 0 0 18px;
    font-size: 14px;
    line-height: 1.45;
    color: rgba(255,255,255,0.72);
  }
  .share-diary-modal-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
  }
  .share-diary-btn {
    width: 100%;
    min-height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 16px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.12);
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.06));
    color: rgba(255,255,255,0.92);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: border-color .18s ease, background .18s ease, transform .18s ease;
    box-shadow: 0 8px 22px rgba(0,0,0,0.22);
  }
  .share-diary-btn:hover {
    border-color: rgba(127, 227, 106, 0.28);
    background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(127, 227, 106, 0.06));
    transform: translateY(-1px);
  }
  .share-diary-btn-copy {
    border-color: rgba(127, 227, 106, 0.22);
    box-shadow:
      0 8px 22px rgba(0,0,0,0.22),
      0 0 16px rgba(52, 211, 153, 0.10);
  }
  .share-modal-button {
    gap: 16px;
  }
  .share-action-icon {
    width: 42px !important;
    height: 42px !important;
    min-width: 42px;
    max-width: none;
    max-height: none;
    object-fit: contain;
    flex-shrink: 0;
    display: block;
  }
  @media (max-width: 430px) {
    .share-action-icon {
      width: 38px !important;
      height: 38px !important;
      min-width: 38px;
    }
  }
  .share-diary-modal-close {
    width: 100%;
    min-height: 44px;
  }
  .share-diary-manual {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.10);
  }
  .share-diary-manual.is-visible {
    display: block;
  }
  .share-diary-manual-hint {
    margin: 0 0 10px;
    font-size: 13px;
    line-height: 1.45;
    color: rgba(255,255,255,0.72);
  }
  .share-diary-manual textarea {
    width: 100%;
    min-height: 200px;
    resize: vertical;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.9);
    padding: 12px;
    font-size: 12px;
    line-height: 1.45;
    font-family: inherit;
    box-sizing: border-box;
  }
  .share-diary-manual-select {
    width: 100%;
    margin-top: 10px;
    min-height: 44px;
  }
  .diary-date-picker {
    position: relative;
    min-width: 0;
    width: 100%;
  }
  .diary-date-card {
    width: 100%;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 14px;
    border: 1px solid rgba(127, 227, 106, 0.14);
    background: linear-gradient(180deg, rgba(255,255,255,0.11), rgba(255,255,255,0.07));
    box-shadow: 0 10px 28px rgba(0,0,0,0.22);
    color: rgba(255,255,255,0.94);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.35;
    text-align: left;
    cursor: pointer;
    transition: border-color .22s ease, box-shadow .22s ease, background .22s ease, transform .22s ease;
  }
  .diary-date-card:hover {
    border-color: rgba(127, 227, 106, 0.38);
    background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(127, 227, 106, 0.06));
    box-shadow:
      0 12px 32px rgba(0,0,0,0.24),
      0 0 24px rgba(52, 211, 153, 0.12);
    transform: translateY(-1px);
    filter: none;
  }
  .diary-date-card:active {
    transform: translateY(0);
  }
  .diary-date-card-text {
    flex: 1;
    min-width: 0;
    letter-spacing: -0.01em;
    white-space: nowrap;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .diary-date-card-icon {
    position: relative;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 28px;
    line-height: 0;
    opacity: 1;
    background: none;
    overflow: visible;
  }
  .diary-date-card-icon-img {
    position: absolute;
    left: 50%;
    top: 50%;
    display: block;
    width: 90px;
    height: 90px;
    max-width: none;
    object-fit: contain;
    background: transparent;
    border: none;
    box-shadow: none;
    filter: none;
    transform: translate(-50%, -50%);
  }
  .diary-date-input-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
    opacity: 0;
    pointer-events: none;
    color-scheme: dark;
  }
  .diary-info {
    background: linear-gradient(180deg, rgba(255,255,255,0.11), rgba(255,255,255,0.07));
    border: 1px solid rgba(127, 227, 106, 0.10);
    border-radius: 18px;
    padding: 14px 16px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
  }
  .diary-summary {
    display: grid;
    grid-template-columns: 1.32fr repeat(4, 1fr);
    gap: 12px;
    align-items: stretch;
  }
  .diary-summary .box:first-child .diary-stat-label {
    white-space: nowrap;
    font-size: 12px;
    letter-spacing: 0;
  }
  .diary-summary .box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 96px;
    padding: 14px 10px 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.11), rgba(255,255,255,0.07));
    border-color: rgba(127, 227, 106, 0.10);
  }
  .diary-stat-icon {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    margin-bottom: 6px;
    filter: drop-shadow(0 0 9px rgba(127, 227, 106, 0.45));
    flex-shrink: 0;
    overflow: visible;
  }
  .diary-stat-icon-img {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 52px;
    height: 52px;
    max-width: none;
    object-fit: contain;
    display: block;
    background: transparent;
    border: none;
    transform: translate(-50%, -50%);
  }
  .diary-summary .diary-stat-label {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    height: 36px;
    font-size: 13px;
    line-height: 1.3;
    font-weight: 600;
    color: rgba(255,255,255,0.82);
    letter-spacing: 0.01em;
  }
  .diary-summary .diary-stat-value {
    display: block;
    width: 100%;
    margin-top: 10px;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.1;
    color: rgba(255,255,255,0.92);
    letter-spacing: -0.02em;
    text-align: center;
  }
  .meal-cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
  }
  .meal-card {
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.05));
    border: 1px solid rgba(127, 227, 106, 0.10);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 18px;
    box-shadow: 0 14px 38px rgba(0,0,0,0.30);
    overflow: hidden;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .meal-card.is-open {
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(127, 227, 106, 0.04));
    border-color: rgba(127, 227, 106, 0.22);
    box-shadow:
      0 18px 50px rgba(0,0,0,0.38),
      0 0 28px rgba(52, 211, 153, 0.08);
  }
  .meal-card-header-main {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0;
    min-width: 0;
    flex: 1;
  }
  .meal-card-meal-icon {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    margin-right: 10px;
    align-self: center;
    overflow: visible;
    filter: drop-shadow(0 0 8px var(--accent-glow));
  }
  .meal-card-meal-icon-img {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 56px;
    height: 56px;
    max-width: none;
    object-fit: contain;
    display: block;
    background: transparent;
    border: none;
    transform: translate(-50%, -50%);
  }
  .meal-card-header-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    flex: 1;
  }
  .meal-card-summary {
    display: none;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.74);
    line-height: 1.4;
    word-break: break-word;
  }
  .meal-card:not(.is-open) .meal-card-summary {
    display: block;
  }
  .meal-card:not(.is-open) .meal-card-title {
    display: none;
  }
  .meal-card-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
    box-shadow: none;
    border-radius: 0;
  }
  .meal-card-header:hover {
    background: rgba(255,255,255,0.04);
    transform: none;
    filter: none;
  }
  .meal-card-chevron {
    color: var(--muted);
    font-size: 14px;
    transition: transform .18s ease;
    flex-shrink: 0;
  }
  .meal-card.is-open .meal-card-chevron {
    transform: rotate(180deg);
  }
  .meal-card-body {
    display: none;
    padding: 0 18px 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .meal-card.is-open .meal-card-body {
    display: block;
    padding-top: 16px;
  }
  .meal-time-row {
    margin-bottom: 10px;
  }
  .meal-time-label {
    display: block;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 5px;
    line-height: 1.3;
  }
  .slot-label,
  .meal-feeling-label {
    display: block;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .meal-time-picker {
    display: inline-flex;
    align-items: center;
    padding: 6px 10px;
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.06));
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 4px 14px rgba(0,0,0,0.16);
  }
  .meal-time-inputs {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .meal-time-inputs select {
    width: auto;
    min-width: 58px;
    max-width: 72px;
    padding: 7px 9px;
    border-radius: 9px;
    font-size: 14px;
  }
  .meal-time-separator {
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    padding: 0 1px;
    user-select: none;
  }
  .meal-slots {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .slot-row {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 12px;
    align-items: center;
  }
  .slot-stub {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .meal-feeling-row textarea {
    width: 100%;
    min-height: 110px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    outline: none;
    font-size: 16px;
    font-family: inherit;
    resize: vertical;
    background: rgba(10,16,24,0.55);
    color: var(--text);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .meal-feeling-row textarea::placeholder {
    color: rgba(255,255,255,0.42);
  }
  .meal-feeling-row textarea:hover {
    border-color: rgba(255,255,255,0.18);
  }
  .meal-feeling-row textarea:focus {
    border-color: rgba(34,197,94,0.60);
    box-shadow:
      0 0 0 4px rgba(34,197,94,0.18),
      0 12px 30px rgba(0,0,0,0.35);
    background: rgba(10,16,24,0.70);
  }
  select {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    outline: none;
    font-size: 16px;
    font-family: inherit;
    background: rgba(10,16,24,0.55);
    color: var(--text);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    color-scheme: dark;
  }
  select:hover { border-color: rgba(255,255,255,0.18); }
  select:focus {
    border-color: rgba(34,197,94,0.60);
    box-shadow: 0 0 0 4px rgba(34,197,94,0.18), 0 12px 30px rgba(0,0,0,0.35);
    background: rgba(10,16,24,0.70);
  }
  .breakfast-slots {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }
  .breakfast-slot-row {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.20);
    transition: border-color .18s ease, background .18s ease;
  }
  .breakfast-slot-row.is-filled {
    border-color: rgba(52,211,153,0.38);
    background: linear-gradient(180deg, rgba(12,22,18,0.78), rgba(10,16,24,0.68));
    box-shadow: 0 10px 28px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.07);
  }
  .breakfast-slot-row.is-filled .breakfast-slot-label {
    color: rgba(255,255,255,0.96);
  }
  .breakfast-slot-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .breakfast-slot-label {
    font-weight: 700;
    font-size: 15px;
    color: rgba(255,255,255,0.90);
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .breakfast-slot-check {
    font-size: 14px;
    line-height: 1;
  }
  .breakfast-slot-status {
    font-size: 12px;
    font-weight: 600;
    color: #a7f3d0;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(34,197,94,0.18);
    border: 1px solid rgba(52,211,153,0.35);
  }
  .breakfast-add-more {
    font-size: 13px;
    font-weight: 700;
    padding: 8px 14px;
    color: rgba(240,253,244,0.95);
    background: linear-gradient(180deg, rgba(34,197,94,0.30), rgba(22,163,74,0.24));
    border: 1px solid rgba(52,211,153,0.48);
    box-shadow: 0 0 0 0 rgba(34,197,94,0.2);
    animation: breakfast-addmore-pulse 3.2s ease-in-out infinite;
  }
  .breakfast-add-more:hover {
    background: linear-gradient(180deg, rgba(34,197,94,0.44), rgba(22,163,74,0.36));
    border-color: rgba(74,222,128,0.62);
    box-shadow: 0 0 18px rgba(34,197,94,0.32);
    transform: translateY(-1px);
    filter: none;
  }
  @keyframes breakfast-addmore-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.16); }
    50% { box-shadow: 0 0 14px 2px rgba(34,197,94,0.24); }
  }
  .breakfast-slot-items {
    margin-bottom: 12px;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(8,14,22,0.58);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .breakfast-slot-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    margin-bottom: 6px;
    color: rgba(255,255,255,0.92);
  }
  .breakfast-slot-item:last-child { margin-bottom: 0; }
  .breakfast-slot-item-meta {
    color: rgba(255,255,255,0.72);
    margin-top: 4px;
    line-height: 1.5;
  }
  .breakfast-slot-form-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .breakfast-form-extra-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  .breakfast-form-cancel {
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.75);
    border-radius: 10px;
    min-width: 34px;
    height: 34px;
    padding: 0 10px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    box-shadow: none;
    font-weight: 600;
  }
  .breakfast-form-cancel:hover {
    background: rgba(251,113,133,0.14);
    border-color: rgba(251,113,133,0.35);
    color: rgba(255,255,255,0.92);
    transform: none;
    filter: none;
  }
  .breakfast-slot-item .delete {
    padding: 6px 9px;
    min-width: 34px;
    font-size: 16px;
  }
  .breakfast-manual {
    margin-top: 8px;
    padding: 12px 14px;
    border: 1px dashed rgba(251,191,36,0.45);
    border-radius: 12px;
    background: rgba(251,191,36,0.07);
  }
  .breakfast-manual-title {
    color: rgba(251,191,36,0.95);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .breakfast-manual-panel {
    margin-top: 10px;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid rgba(251,191,36,0.38);
    background: rgba(10,16,24,0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .breakfast-manual-form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .breakfast-manual-full {
    grid-column: 1 / -1;
  }
  .breakfast-manual-panel label,
  .breakfast-manual-fields label {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 6px;
  }
  .breakfast-manual-actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .breakfast-legacy-block {
    margin-bottom: 12px;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px dashed rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.04);
  }
  .breakfast-legacy-title {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .breakfast-slot-form {
    display: grid;
    grid-template-columns: 1.8fr 0.75fr auto;
    gap: 10px;
    align-items: start;
  }
  .breakfast-slot-form button {
    padding: 14px 16px;
    font-size: 14px;
    white-space: nowrap;
  }
  .meal-entries-list {
    margin-bottom: 16px;
  }
  .meal-entries-list .empty {
    margin-bottom: 0;
  }
  .meal-entry .meta {
    font-size: 13px;
  }
  .meal-entry-category {
    color: rgba(34,197,94,0.85);
    font-weight: 600;
  }
  .meal-totals-wrap {
    margin-bottom: 16px;
  }
  .meal-totals-title {
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .meal-totals {
    margin: 0;
    padding-bottom: 0;
    border-bottom: none;
    grid-template-columns: repeat(4, 1fr);
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    .breakfast-add-more { animation: none !important; }
  }
  @media (max-width: 760px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
    .diary-summary { grid-template-columns: repeat(2, 1fr); }
    .slot-row { grid-template-columns: 1fr; }
    .breakfast-slot-form { grid-template-columns: 1fr; }
    .breakfast-manual-form-grid { grid-template-columns: 1fr; }
    .meal-totals { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 430px) {
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }
    body { padding: 12px; }
    .app {
      padding: 18px 14px 16px;
      overflow-x: hidden;
    }
    .app-title {
      justify-content: center;
      flex-wrap: nowrap;
      gap: 10px;
      margin-bottom: 16px;
      font-size: 28px;
      line-height: 1.05;
    }
    .app-title-text {
      white-space: nowrap;
    }
    .app-title-icon-img {
      width: 96px;
      height: 96px;
      max-width: 96px;
    }
    .diary-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "date date"
        "newday newday"
        "clear share";
      gap: 8px;
      margin-bottom: 16px;
    }
    .diary-date-picker {
      grid-area: date;
      min-width: 0;
      width: 100%;
    }
    .diary-date-card {
      width: 100%;
      font-size: 13px;
      padding: 10px 12px;
      gap: 10px;
    }
    .diary-date-card-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      justify-content: center;
    }
    .diary-date-card-icon {
      width: 36px;
      height: 22px;
    }
    .diary-date-card-icon-img {
      width: 56px;
      height: 56px;
    }
    .diary-controls > button {
      width: 100%;
      max-width: none;
      min-height: 44px;
      height: 44px;
      padding: 10px 12px;
      font-size: 13px;
    }
    .diary-controls > button:nth-child(2) {
      grid-area: newday;
    }
    .diary-controls > button:nth-child(3) {
      grid-area: clear;
      padding: 10px 12px;
      font-size: 13px;
    }
    .diary-controls > button:nth-child(4) {
      grid-area: share;
      padding: 10px 12px;
      font-size: 13px;
    }
    .diary-controls .btn-clear {
      padding: 10px 12px;
      font-size: 13px;
    }
    .btn-label-full { display: none; }
    .btn-label-short { display: inline; }
    .diary-summary {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .diary-summary .box {
      min-height: 96px;
      padding: 12px 8px 14px;
    }
    .diary-summary .diary-stat-value {
      font-size: 21px;
    }
    .diary-summary .diary-stat-label {
      font-size: 12px;
      height: 34px;
    }
    .meal-cards {
      gap: 10px;
      margin-top: 16px;
    }
    .meal-card {
      width: 100%;
    }
    .meal-card-header {
      padding: 13px 15px;
      font-size: 16px;
      gap: 10px;
    }
    .meal-card-body {
      padding: 0 15px 15px;
    }
    .meal-card.is-open .meal-card-body {
      padding-top: 13px;
    }
    .meal-card-title {
      white-space: nowrap;
    }
    .meal-card-summary {
      font-size: 12px;
    }
    .meal-card-chevron {
      flex-shrink: 0;
    }
    .slot-label,
    .meal-feeling-label {
      font-size: 13px;
    }
    .meal-totals-title {
      font-size: 13px;
    }
    .meal-totals .box span {
      font-size: 21px;
    }
    input {
      font-size: 15px;
      padding: 12px 14px;
    }
  }
  @media (max-width: 390px) {
    .app-title { font-size: 26px; }
    .app-title-icon-img {
      width: 88px;
      height: 88px;
      max-width: 88px;
    }
    .diary-date-card { font-size: 12px; }
    .diary-date-card-icon-img { width: 52px; height: 52px; }
    .diary-summary .diary-stat-value { font-size: 20px; }
    .meal-card-header { font-size: 15px; }
  }
  @media (max-width: 375px) {
    .app-title { font-size: 25px; gap: 8px; }
    .app-title-icon-img {
      width: 84px;
      height: 84px;
      max-width: 84px;
    }
    .diary-controls > button { font-size: 12px; padding: 10px 10px; }
  }
  @media (max-width: 360px) {
    .app-title { font-size: 24px; }
    .app-title-icon-img {
      width: 80px;
      height: 80px;
      max-width: 80px;
    }
    .diary-date-card { font-size: 11.5px; padding: 9px 10px; }
    .diary-summary .diary-stat-label { font-size: 11px; }
  }
  @media (max-width: 320px) {
    body { padding: 10px; }
    .app { padding: 14px 10px 14px; }
    .app-title { font-size: 22px; gap: 8px; }
    .app-title-icon-img {
      width: 76px;
      height: 76px;
      max-width: 76px;
    }
    .diary-date-card { font-size: 11px; }
    .diary-date-card-icon-img { width: 48px; height: 48px; }
    .diary-controls > button { font-size: 11.5px; padding: 10px 8px; gap: 6px; }
    .diary-summary .diary-stat-value { font-size: 18px; }
    .meal-card-header { padding: 12px 13px; font-size: 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <section class="diary-section" aria-label="Дневник питания">
    <h1 class="app-title">
      <span class="app-title-icon" aria-hidden="true">
        <img src="icons/diary-icon.png" alt="" class="app-title-icon-img" width="118" height="118" decoding="async" />
      </span>
      <span class="app-title-text">Дневник питания</span>
    </h1>
    <div class="diary-controls">
      <div class="diary-date-picker">
        <button type="button" class="diary-date-card" id="diaryDateCard" onclick="openDiaryDatePicker()" aria-label="Выбрать дату">
          <span class="diary-date-card-icon" aria-hidden="true">
            <img src="icons/calendar-icon.png" alt="" class="diary-date-card-icon-img" width="90" height="90" decoding="async" />
          </span>
          <span class="diary-date-card-text" id="diaryDateCardText"></span>
        </button>
        <input type="date" id="diaryDate" class="diary-date-input-hidden" onchange="onDiaryDateChange()" tabindex="-1" aria-hidden="true" />
      </div>
      <button type="button" onclick="startNewDay()"><span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>Новый день</button>
      <button type="button" class="btn-clear" onclick="clearDiaryDay()"><span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></span>Очистить день</button>
      <button type="button" class="btn-clear btn-share-diary" onclick="copyDiaryReport()"><span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg></span><span class="btn-label-full">Поделиться дневником</span><span class="btn-label-short">Поделиться</span></button>
    </div>
    <div class="diary-info">
      <div class="diary-summary">
        <div class="box">
          <span class="diary-stat-icon" aria-hidden="true"><img src="icons/meals-icon.png" alt="" class="diary-stat-icon-img" width="52" height="52" decoding="async" /></span>
          <div class="diary-stat-label">Приёмов пищи</div><div class="diary-stat-value" id="diaryMeals">0</div>
        </div>
        <div class="box">
          <span class="diary-stat-icon" aria-hidden="true"><img src="icons/calories-icon.png" alt="" class="diary-stat-icon-img" width="52" height="52" decoding="async" /></span>
          <div class="diary-stat-label">Ккал за день</div><div class="diary-stat-value" id="diaryCalories">0</div>
        </div>
        <div class="box">
          <span class="diary-stat-icon" aria-hidden="true"><img src="icons/protein-icon.png" alt="" class="diary-stat-icon-img" width="52" height="52" decoding="async" /></span>
          <div class="diary-stat-label">Белки</div><div class="diary-stat-value" id="diaryProtein">0 г</div>
        </div>
        <div class="box">
          <span class="diary-stat-icon" aria-hidden="true"><img src="icons/fat-icon.png" alt="" class="diary-stat-icon-img" width="52" height="52" decoding="async" /></span>
          <div class="diary-stat-label">Жиры</div><div class="diary-stat-value" id="diaryFat">0 г</div>
        </div>
        <div class="box">
          <span class="diary-stat-icon" aria-hidden="true"><img src="icons/carbs-icon.png" alt="" class="diary-stat-icon-img" width="52" height="52" decoding="async" /></span>
          <div class="diary-stat-label">Углеводы</div><div class="diary-stat-value" id="diaryCarbs">0 г</div>
        </div>
      </div>
    </div>

    <div class="meal-cards" id="mealCards"></div>
  </section>
</div>
<div id="copyDiaryToast" class="copy-diary-toast" role="status" aria-live="polite"></div>
<div id="shareDiaryModal" class="share-diary-modal" role="dialog" aria-modal="true" aria-labelledby="shareDiaryModalTitle" onclick="if(event.target===this)closeShareDiaryModal()">
  <div class="share-diary-modal-panel">
    <h2 id="shareDiaryModalTitle" class="share-diary-modal-title">Поделиться дневником</h2>
    <p class="share-diary-modal-hint">Скопируйте отчёт или отправьте его в мессенджер.</p>
    <div class="share-diary-modal-actions">
      <button type="button" class="share-diary-btn share-diary-btn-copy share-modal-button" onclick="copyShareDiaryReport()"><img src="icons/icon-copy-report.png" alt="" class="share-action-icon" width="42" height="42" decoding="async" aria-hidden="true" /><span>Скопировать отчёт</span></button>
      <button type="button" class="share-diary-btn share-modal-button" onclick="shareDiaryToTelegram()"><img src="icons/icon-telegram.png" alt="" class="share-action-icon" width="42" height="42" decoding="async" aria-hidden="true" /><span>Telegram</span></button>
      <button type="button" class="share-diary-btn share-modal-button" onclick="shareDiaryToMax()"><img src="icons/icon-max.png" alt="" class="share-action-icon" width="42" height="42" decoding="async" aria-hidden="true" /><span>MAX</span></button>
    </div>
    <div id="shareDiaryManual" class="share-diary-manual">

<script>
const LEGACY_COUNTER_STORAGE_KEY = "calorie_counter_items_v1";
const LEGACY_COUNTER_DRAFT_KEY = "calorie_counter_draft_v1";
const DIARY_APP_NAME = "Дневник питания";
const DIARY_KEY = "food_diary_v1";
const foodDB = Array.isArray(window.foodDB) ? window.foodDB : [];
let foodNameIndex = null;

function rebuildFoodNameIndex(){
  foodNameIndex = new Map();
  foodDB.forEach(food => {
    if(!food || !food.name) return;
    foodNameIndex.set(normalize(food.name), food);
    if(Array.isArray(food.aliases)){
      food.aliases.forEach(alias => {
        if(alias) foodNameIndex.set(normalize(alias), food);
      });
    }
  });
}
function getFoodKcal(food){
  if(!food) return 0;
  if(typeof food.kcal === "number") return food.kcal;
  if(typeof food.calories === "number") return food.calories;
  return 0;
}
function initFoodDB(){
  rebuildFoodNameIndex();
}
function getFoodByName(name){
  if(!name) return null;
  if(!foodNameIndex) rebuildFoodNameIndex();
  return foodNameIndex.get(normalize(name)) || null;
}
function foodMatchesQuery(food, input){
  if(!food || !input) return false;
  const name = normalize(food.name);
  const aliasNorms = Array.isArray(food.aliases)
    ? food.aliases.filter(Boolean).map(alias => normalize(alias))
    : [];
  const haystacks = [name, ...aliasNorms];
  if(haystacks.some(h => h.includes(input) || (input.length >= h.length && input.includes(h)))) return true;
  const tokens = input.split(/\s+/).filter(token => token.length >= 3);
  if(tokens.length > 1){
    return tokens.every(token => haystacks.some(h => h.includes(token)));
  }
  return false;
}
function searchFoods(query, allowedNames){
  const input = normalize(query);
  if(!input) return [];
  let pool = foodDB;
  if(allowedNames){
    const allowed = new Set(allowedNames.map(n => normalize(n)));
    pool = foodDB.filter(food => food && allowed.has(normalize(food.name)));
  }
  return pool.filter(food => foodMatchesQuery(food, input)).slice(0, 12);
}
function findExactProduct(input){
  const food = getFoodByName(input);
  return food ? food.name : null;
}

const MEALS = ["breakfast", "lunch", "snack", "dinner"];
const MEAL_LABELS = {
  breakfast: "Завтрак",
  lunch: "Обед",
  snack: "Полдник",
  dinner: "Ужин"
};
const SLOTS = ["side", "protein", "vegetables", "butter", "oil", "dessert"];
const SLOT_LABELS = {
  side: "Гарнир / Хлеб",
  protein: "Белок / Молочные продукты",
  vegetables: "Овощи / Зелень",
  butter: "Масло сливочное",
  oil: "Масло растительное",
  dessert: "Десерт / фрукт / сладкое / напитки"
};
const BUTTER_PRODUCTS = ["масло сливочное 72,5%", "масло сливочное 82,5%"];
const OIL_PRODUCTS = ["масло подсолнечное", "масло оливковое", "масло льняное", "масло кокосовое"];

let mealHourOptionsHtml = "";

function getTodayISO(){
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function createEmptySlots(){
  const slots = {};
  SLOTS.forEach(s => { slots[s] = null; });
  return slots;
}
function createEmptyMeal(){
  return { time: "", slots: createEmptySlots(), entries: [], feeling: "" };
}
function calcProductNutrition(key, grams){
  const food = getFoodByName(key);
  if(!food) return { name: key, grams, calories: 0, protein: 0, fat: 0, carbs: 0 };
  const factor = grams / 100;
  return {
    name: food.name,
    grams,
    calories: Math.round(getFoodKcal(food) * factor),
    protein: +(food.protein * factor).toFixed(1),
    fat: +(food.fat * factor).toFixed(1),
    carbs: +(food.carbs * factor).toFixed(1)
  };
}
function calcManualNutrition(name, grams, per100){
  const factor = grams / 100;
  return {
    name: name.trim(),
    grams,
    calories: Math.round(per100.cal * factor),
    protein: +(per100.p * factor).toFixed(1),
    fat: +(per100.f * factor).toFixed(1),
    carbs: +(per100.c * factor).toFixed(1),
    manual: true
  };
}
function createEmptyDay(date){
  const meals = {};
  MEALS.forEach(m => { meals[m] = createEmptyMeal(); });
  return { date: date || getTodayISO(), meals };
}
function calcNutrition(items){
  let calories = 0, protein = 0, fat = 0, carbs = 0;
  if(!Array.isArray(items)) return { calories: 0, protein: 0, fat: 0, carbs: 0 };
  items.forEach(it => {
    if(!it) return;
    if(typeof it.calories === "number") calories += it.calories;
    if(typeof it.protein === "number") protein += it.protein;
    if(typeof it.fat === "number") fat += it.fat;
    if(typeof it.carbs === "number") carbs += it.carbs;
  });
  return {
    calories: Math.round(calories),
    protein: +protein.toFixed(1),
    fat: +fat.toFixed(1),
    carbs: +carbs.toFixed(1)
  };
}

let diary = { version: 1, days: {} };

function getTodayDate(){
  return getTodayISO();
}
let currentDate = getTodayDate();

function createEmptyDiary(){
  return { version: 1, days: {} };
}
function isValidLegacyItem(it){
  return it && typeof it.name === "string" && getFoodByName(it.name) &&
    typeof it.grams === "number" && it.grams > 0 &&
    typeof it.calories === "number" && typeof it.protein === "number" &&
    typeof it.fat === "number" && typeof it.carbs === "number";
}
function dayHasProducts(day){
  if(!day || !day.meals) return false;
  for(const mealId of MEALS){
    const meal = day.meals[mealId];
    if(!meal) continue;
    if(Array.isArray(meal.entries) && meal.entries.length > 0) return true;
    if(Array.isArray(meal.legacyItems) && meal.legacyItems.length > 0) return true;
    if(!meal.slots) continue;
    for(const slotId of SLOTS){
      if(meal.slots[slotId]) return true;
    }
  }
  return false;
}
function loadDiary(){
  try {
    const raw = localStorage.getItem(DIARY_KEY);
    if(!raw){
      diary = createEmptyDiary();
      return diary;
    }
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object" || !parsed.days || typeof parsed.days !== "object"){
      diary = createEmptyDiary();
      return diary;
    }
    diary = { version: parsed.version || 1, days: parsed.days };
    return diary;
  } catch(e){
    diary = createEmptyDiary();
    return diary;
  }
}
function saveDiary(diaryToSave){
  try {
    if(diaryToSave) diary = diaryToSave;
    localStorage.setItem(DIARY_KEY, JSON.stringify(diary));
  } catch(e) {}
}
function getDay(date){
  const d = date || currentDate;
  if(!diary.days) diary.days = {};
  if(!diary.days[d]) diary.days[d] = createEmptyDay(d);
  return diary.days[d];
}
function saveDay(date, day){
  const d = date || currentDate;
  if(!diary.days) diary.days = {};
  diary.days[d] = day;
  saveDiary(diary);
}
function migrateLegacyItems(){
  try {
    const raw = localStorage.getItem(LEGACY_COUNTER_STORAGE_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed) || parsed.length === 0) return;
    const legacyItems = parsed.filter(isValidLegacyItem);
    if(legacyItems.length === 0) return;

    const today = getTodayDate();
    const day = getDay(today);
    if(dayHasProducts(day)) return;

    if(!day.meals.breakfast) day.meals.breakfast = createEmptyMeal();
    day.meals.breakfast.legacyItems = legacyItems.map(it => ({
      name: it.name,
      grams: it.grams,
      calories: it.calories,
      protein: it.protein,
      fat: it.fat,
      carbs: it.carbs
    }));
    saveDay(today, day);
    try {
      localStorage.removeItem(LEGACY_COUNTER_STORAGE_KEY);
      localStorage.removeItem(LEGACY_COUNTER_DRAFT_KEY);
    } catch(e) {}
  } catch(e) {}
}
const WEEKDAY_NAMES = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
const WEEKDAY_SHORT = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
const MONTH_NAMES_GENITIVE = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
function formatDiaryDate(iso){
  const parts = iso.split("-").map(Number);
  if(parts.length !== 3 || parts.some(isNaN)) return iso;
  const dt = new Date(parts[0], parts[1] - 1, parts[2]);
  const weekdayShort = WEEKDAY_SHORT[dt.getDay()];
  const day = dt.getDate();
  const month = MONTH_NAMES_GENITIVE[dt.getMonth()];
  const year = dt.getFullYear();
  const formatted = `${weekdayShort} • ${day} ${month} ${year}`;
  if(iso === getTodayISO()){
    return `Сегодня • ${weekdayShort} • ${day} ${month} ${year}`;
  }
  return formatted;
}
function ensureMealStructure(meal){
  if(!meal) meal = createEmptyMeal();
  if(!meal.slots) meal.slots = createEmptySlots();
  if(!Array.isArray(meal.entries)) meal.entries = [];
  if(typeof meal.feeling !== "string") meal.feeling = "";
  if(typeof meal.time !== "string") meal.time = "";
  return meal;
}
function getSlotLabel(slotId){
  if(slotId === "legacy") return "Перенесено";
  return SLOT_LABELS[slotId] || slotId;
}
function getMealProducts(meal){
  const products = [];
  if(!meal) return products;
  if(Array.isArray(meal.entries)){
    meal.entries.forEach(it => { if(it && it.name) products.push(it); });
  }
  if(meal.slots){
    SLOTS.forEach(slotId => {
      if(meal.slots[slotId]) products.push(meal.slots[slotId]);
    });
  }
  if(Array.isArray(meal.legacyItems)) products.push(...meal.legacyItems);
  return products;
}
function getMealEntriesForDisplay(meal){
  const list = [];
  if(!meal) return list;
  ensureMealStructure(meal);
  meal.entries.forEach((it, i) => {
    if(it && it.name) list.push({ ...it, _source: "entries", _index: i });
  });
  if(Array.isArray(meal.legacyItems)){
    meal.legacyItems.forEach((it, i) => {
      if(it && it.name) list.push({ ...it, slot: it.slot || "legacy", _source: "legacyItems", _index: i });
    });
  }
  SLOTS.forEach(slotId => {
    if(meal.slots && meal.slots[slotId]){
      list.push({ ...meal.slots[slotId], slot: slotId, _source: "slots", _index: slotId });
    }
  });
  return list;
}
function getDayDiaryStats(date){
  const day = getDay(date);
  let mealCount = 0;
  const allProducts = [];
  MEALS.forEach(mealId => {
    const meal = day.meals[mealId];
    const products = getMealProducts(meal);
    if(products.length > 0) mealCount++;
    allProducts.push(...products);
  });
  return { mealCount, nutrition: calcNutrition(allProducts) };
}

  if(carbsEl) carbsEl.textContent = n.carbs + " г";
}
const mealCardOpenState = {};
function getCurrentMealByTime(now){
  const dt = now || new Date();
  const minutes = dt.getHours() * 60 + dt.getMinutes();
  if(minutes >= 300 && minutes < 660) return "breakfast";
  if(minutes >= 660 && minutes < 960) return "lunch";
  if(minutes >= 960 && minutes < 1110) return "snack";
  return "dinner";
}
function initMealCardOpenState(){
  const currentMeal = getCurrentMealByTime();
  MEALS.forEach(mealId => {
    mealCardOpenState[mealId] = mealId === currentMeal;
  });
}
function isMealCardOpen(mealId){
  return !!mealCardOpenState[mealId];
}
function applyMealCardOpenState(mealId){

  if(!card) return;
  const isOpen = isMealCardOpen(mealId);

  if(header) header.setAttribute("aria-expanded", isOpen ? "true" : "false");
}
function formatProductCountLabel(count){
  const n = Math.abs(count) % 100;
  const n1 = n % 10;
  if(n > 10 && n < 20) return count + " продуктов";
  if(n1 === 1) return count + " продукт";
  if(n1 >= 2 && n1 <= 4) return count + " продукта";
  return count + " продуктов";
}
function buildMealCardSummary(mealId, meal){
  const products = getMealProducts(meal);
  const totals = calcNutrition(products);
  const time = (meal.time || "").trim() || "—";
  const parts = [
    MEAL_LABELS[mealId],
    time,
    formatProductCountLabel(products.length),
    totals.calories + " ккал"
  ];
  if((meal.feeling || "").trim()) parts.push("есть ощущения");
  return parts.join(" · ");
}
function updateMealCardSummary(mealId, meal){

  if(el) el.textContent = buildMealCardSummary(mealId, meal || getMeal(mealId));
}

function getMealUi(mealId){

const DIARY_REPORT_SEPARATOR = "━━━━━━━━━━━━━━";
const DIARY_REPORT_DAY_SEPARATOR = "════════════════════";
const MEAL_REPORT_META = {
  breakfast: { emoji: "🍳", title: "ЗАВТРАК", totalLabel: "ИТОГ ЗАВТРАКА" },

function formatDiaryReportDate(iso){
  const parts = iso.split("-").map(Number);
  if(parts.length !== 3 || parts.some(isNaN)) return iso;
  const dt = new Date(parts[0], parts[1] - 1, parts[2]);
  const weekdayUpper = WEEKDAY_SHORT[dt.getDay()].toUpperCase();
  const day = dt.getDate();
  const month = MONTH_NAMES_GENITIVE[dt.getMonth()];
  const year = dt.getFullYear();
  const datePart = `${weekdayUpper} • ${day} ${month} ${year}`;
  if(iso === getTodayISO()) return `Сегодня, ${datePart}`;

function formatReportMacroValue(value, isCalories){
  const n = typeof value === "number" ? value : 0;
  if(isCalories) return String(Math.round(n));
  const rounded = +n.toFixed(1);
  return rounded % 1 === 0 ? String(Math.round(rounded)) : String(rounded);
}
function formatDiaryReportMacros(cal, prot, fat, carbs){
  return [
    formatReportMacroValue(cal, true) + " ккал",
    "Б " + formatReportMacroValue(prot, false),
    "Ж " + formatReportMacroValue(fat, false),
    "У " + formatReportMacroValue(carbs, false)
  ].join(" · ");
}
function formatDiaryReportProduct(entry){
  const name = entry.name || "—";
  const grams = typeof entry.grams === "number" ? entry.grams : 0;
  const cal = typeof entry.calories === "number" ? entry.calories : 0;
  const prot = typeof entry.protein === "number" ? entry.protein : 0;
  const fat = typeof entry.fat === "number" ? entry.fat : 0;
  const carbs = typeof entry.carbs === "number" ? entry.carbs : 0;
  return [
    `• ${name} — ${grams} г`,
    formatDiaryReportMacros(cal, prot, fat, carbs)
  ].join("\n");
}
function getMealReportSlotOrder(){
  return SLOTS.concat(["legacy"]);
}
function getMealReportSlotLabel(slotId){
  if(slotId === "legacy") return "Перенесённые продукты";
  return getMealSlotLabel(slotId);
}
function formatMealReportCategory(slotId){
  const emoji = SLOT_REPORT_EMOJI[slotId] || "•";
  return `${emoji} ${getMealReportSlotLabel(slotId)}`;
}
function formatMealReportHeader(mealId, meal){
  const meta = MEAL_REPORT_META[mealId] || { emoji: "🍽", title: (MEAL_LABELS[mealId] || mealId).toUpperCase(), totalLabel: "ИТОГ" };
  const time = (meal.time || "").trim();
  const title = time ? `${meta.title} — ${time}` : meta.title;
  return [
    DIARY_REPORT_SEPARATOR,
    "",
    `${meta.emoji} ${title}`,
    DIARY_REPORT_SEPARATOR,
    ""
  ].join("\n");
}
function buildMealReportSection(mealId, meal){
  const products = getMealProducts(meal);
  if(!products.length) return "";
  const meta = MEAL_REPORT_META[mealId] || { totalLabel: "ИТОГ" };
  const lines = [formatMealReportHeader(mealId, meal)];
  const grouped = {};
  getMealEntriesForDisplay(meal).forEach(entry => {
    const slot = entry.slot || "legacy";
    if(!grouped[slot]) grouped[slot] = [];
    grouped[slot].push(entry);
  });
  getMealReportSlotOrder().forEach(slotId => {
    const items = grouped[slotId];
    if(!items || !items.length) return;
    lines.push(formatMealReportCategory(slotId));
    lines.push("");
    items.forEach(entry => lines.push(formatDiaryReportProduct(entry)));
    lines.push("");
  });
  const feeling = (meal.feeling || "").trim();
  if(feeling){
    lines.push("📝 ОЩУЩЕНИЯ ПОСЛЕ ЕДЫ");
    lines.push("");
    lines.push(feeling);
    lines.push("");
    lines.push("");
  } else {
    lines.push("");
  }
  const totals = calcNutrition(products);
  lines.push(`✅ ${meta.totalLabel}`);
  lines.push("");
  lines.push(formatDiaryReportMacros(totals.calories, totals.protein, totals.fat, totals.carbs));
  return lines.join("\n");
}
function buildDiaryReportText(date){
  const day = getDay(date);
  const mealSections = [];
  MEALS.forEach(mealId => {
    const meal = ensureMealStructure(day.meals[mealId] || createEmptyMeal());
    const section = buildMealReportSection(mealId, meal);
    if(section) mealSections.push(section);
  });
  const dayStats = getDayDiaryStats(date);
  const n = dayStats.nutrition;
  const lines = [
    "📒 ЭЛЕКТРОННЫЙ ДНЕВНИК ПИТАНИЯ",
    "📅 " + formatDiaryReportDate(date),
    ""
  ];
  if(mealSections.length) lines.push(mealSections.join("\n\n"));
  if(mealSections.length){
    lines.push("");
    lines.push("");
    lines.push("");
  }
  lines.push(DIARY_REPORT_DAY_SEPARATOR);
  lines.push("");
  lines.push("📊 ИТОГО ЗА ДЕНЬ");
  lines.push("");
  lines.push(`Калории: ${n.calories} ккал`);
  lines.push(`Белки: ${n.protein} г`);
  lines.push(`Жиры: ${n.fat} г`);
  lines.push(`Углеводы: ${n.carbs} г`);
  lines.push("");
  lines.push(DIARY_REPORT_DAY_SEPARATOR);
  lines.push("");
  return lines.join("\n");
}
let copyDiaryToastTimer = null;
let pendingShareDiaryText = "";
const SHARE_DIARY_MANUAL_HINT_DEFAULT = "Браузер не разрешил автоматическое копирование. Выделите отчёт и скопируйте вручную (Ctrl+C).";
function prepareShareDiaryText(){
  MEALS.forEach(mealId => {

function writeShareDiaryToClipboardSync(text){
  if(!text) return false;
  try {
    const area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;";
    document.body.appendChild(area);
    area.focus();
    area.select();
    area.setSelectionRange(0, text.length);
    const copied = document.execCommand("copy");
    document.body.removeChild(area);
    return copied;
  } catch(e) {
    return false;
  }
}
async function writeShareDiaryToClipboard(text){
  if(!text) return false;
  if(writeShareDiaryToClipboardSync(text)) return true;
  if(navigator.clipboard && typeof navigator.clipboard.writeText === "function"){
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch(e) {}
  }
  return writeShareDiaryToClipboardSync(text);
}

  for(let h = 0; h < 24; h++){
    const v = String(h).padStart(2, "0");
    html += `<option value="${v}">${v}</option>`;
  }
  mealHourOptionsHtml = html;
  return mealHourOptionsHtml;
}
function getMealMinuteOptionsHtml(){
  if(mealMinuteOptionsHtml) return mealMinuteOptionsHtml;
  let html = '<option value="">—</option>';
  MEAL_TIME_MINUTES.forEach(v => { html += `<option value="${v}">${v}</option>`; });
  mealMinuteOptionsHtml = html;
  return mealMinuteOptionsHtml;
}
function snapToMealMinute(min){
  const n = parseInt(min, 10);
  if(isNaN(n)) return "00";
  const snapped = Math.round(n / 5) * 5;
  const clamped = Math.min(55, Math.max(0, snapped));
  return String(clamped).padStart(2, "0");
}
function parseMealTime(timeStr){
  if(!timeStr || typeof timeStr !== "string") return { hour: "", minute: "" };
  const m = timeStr.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return { hour: "", minute: "" };
  const hourNum = parseInt(m[1], 10);
  if(isNaN(hourNum) || hourNum < 0 || hourNum > 23) return { hour: "", minute: "" };
  return {
    hour: String(hourNum).padStart(2, "0"),
    minute: snapToMealMinute(m[2])
  };
}
function formatMealTime(hour, minute){
  return `${hour}:${minute}`;
}
function updateMealTimeDisplay(mealId, hour, minute){
  const display = document.getElementById("meal-" + mealId + "-time-display");
  if(!display) return;
  if(hour && minute){
    display.textContent = formatMealTime(hour, minute);
    display.classList.remove("is-empty");
  } else {
    display.textContent = "—";
    display.classList.add("is-empty");
  }
}
function onMealTimeChange(mealId){
  const hourEl = document.getElementById("meal-" + mealId + "-hour");
  const minEl = document.getElementById("meal-" + mealId + "-minute");
  if(!hourEl || !minEl) return;
  let hour = hourEl.value;
  let minute = minEl.value;
  if(hour && !minute){
    minEl.value = "00";
    minute = "00";
  }
  if(!hour){
    minEl.value = "";
    minute = "";
  }
  updateMealTimeDisplay(mealId, hour, minute);
  const meal = getMeal(mealId);
  meal.time = (hour && minute) ? formatMealTime(hour, minute) : "";
  persistMeal(mealId, meal);
  updateMealCardSummary(mealId, meal);
}
function renderMealTimePicker(mealId, meal){
  const hourEl = document.getElementById("meal-" + mealId + "-hour");
  const minEl = document.getElementById("meal-" + mealId + "-minute");
  if(!hourEl || !minEl) return;
  const active = document.activeElement;
  if(active === hourEl || active === minEl) return;
  const { hour, minute } = parseMealTime(meal.time || "");
  hourEl.value = hour;
  minEl.value = minute;
  updateMealTimeDisplay(mealId, hour, minute);
}
function buildMealTimePickerHtml(mealId){
  return `
    <div class="meal-time-picker">
      <div class="meal-time-inputs">
        <select id="meal-${mealId}-hour" aria-label="Часы" onchange="onMealTimeChange('${mealId}')">${getMealHourOptionsHtml()}</select>
        <span class="meal-time-separator" aria-hidden="true">:</span>
        <select id="meal-${mealId}-minute" aria-label="Минуты" onchange="onMealTimeChange('${mealId}')">${getMealMinuteOptionsHtml()}</select>
      </div>
    </div>
  `;
}
function saveMealTime(mealId){
  onMealTimeChange(mealId);
}
function saveBreakfastTime(){
  saveMealTime("breakfast");
}
function saveMealFeeling(mealId){
  const meal = getMeal(mealId);
  const el = document.getElementById("meal-" + mealId + "-feeling");
  meal.feeling = el ? el.value : "";
  persistMeal(mealId, meal);
  updateMealCardSummary(mealId, meal);
}
function saveBreakfastFeeling(){
  saveMealFeeling("breakfast");
}
function handleMealEnter(e, mealId, slotId){
  if(e.key === "Enter") addMealEntry(mealId, slotId);
}
function handleBreakfastEnter(e, slotId){
  handleMealEnter(e, "breakfast", slotId);
}
function renderMealCard(mealId){
  const meal = getMeal(mealId);
  const feelingEl = document.getElementById("meal-" + mealId + "-feeling");
  renderMealTimePicker(mealId, meal);
  if(feelingEl && document.activeElement !== feelingEl) feelingEl.value = meal.feeling || "";
  renderMealSlots(mealId, meal);
  const products = getMealProducts(meal);
  const totals = calcNutrition(products);
  const calEl = document.getElementById(mealId + "-total-cal");
  const protEl = document.getElementById(mealId + "-total-prot");
  const fatEl = document.getElementById(mealId + "-total-fat");
  const carbsEl = document.getElementById(mealId + "-total-carbs");
  if(calEl) calEl.textContent = totals.calories;
  if(protEl) protEl.textContent = totals.protein + " г";
  if(fatEl) fatEl.textContent = totals.fat + " г";
  if(carbsEl) carbsEl.textContent = totals.carbs + " г";
  updateMealCardSummary(mealId, meal);
}
function renderBreakfastCard(){
  renderMealCard("breakfast");
}
function renderAllMealCards(){
  MEALS.forEach(mealId => renderMealCard(mealId));
}
function buildMealSlotRow(mealId, slotId){

  const label = getMealSlotLabel(slotId);
  return `
    <div class="breakfast-slot-row" id="${mealId}-slot-row-${slotId}" data-slot="${slotId}">
      <div class="breakfast-slot-header">
        <div class="breakfast-slot-label">
          <span class="breakfast-slot-check" id="${mealId}-${slotId}-check"></span>
          ${label}
          <span class="breakfast-slot-status" id="${mealId}-${slotId}-status"></span>
        </div>
        <button type="button" class="btn-clear breakfast-add-more" id="${mealId}-${slotId}-addmore" style="display:none" onclick="showMealSlotForm('${mealId}', '${slotId}')">+ Добавить ещё</button>
      </div>

        </div>
        <div id="${mealId}-${slotId}-search-form">
          <div class="breakfast-slot-form">
            <div class="field">
              <input id="${mealId}-${slotId}-product" placeholder="${placeholder}" autocomplete="off" oninput="showMealSuggestions('${mealId}', '${slotId}')" onkeydown="handleMealEnter(event, '${mealId}', '${slotId}')" />
              <div id="${mealId}-${slotId}-suggestions" class="suggestions"></div>
              <div id="${mealId}-${slotId}-notfound" class="notfound"></div>

            <input id="${mealId}-${slotId}-grams" type="number" min="1" placeholder="Граммы" onkeydown="handleMealEnter(event, '${mealId}', '${slotId}')" />
            <button type="button" onclick="addMealEntry('${mealId}', '${slotId}')">Добавить</button>
          </div>
          <div id="${mealId}-${slotId}-manual-notice" class="breakfast-manual" style="display:none">
            <div class="breakfast-manual-title">Продукта нет в базе</div>
            <button type="button" class="btn-clear" onclick="openMealManual('${mealId}', '${slotId}')">Добавить вручную</button>
          </div>
        </div>
        <div id="${mealId}-${slotId}-manual-panel" class="breakfast-manual-panel" style="display:none">
          <div class="breakfast-manual-title">Ручное добавление продукта</div>

            </div>

              <label for="${mealId}-${slotId}-manual-grams">Граммы</label>
              <input id="${mealId}-${slotId}-manual-grams" type="number" min="1" placeholder="г" />
            </div>
            <div>
              <label for="${mealId}-${slotId}-manual-cal">Калории на 100 г</label>
              <input id="${mealId}-${slotId}-manual-cal" type="number" min="0" step="1" placeholder="ккал" />
            </div>
            <div>
              <label for="${mealId}-${slotId}-manual-p">Белки на 100 г</label>
              <input id="${mealId}-${slotId}-manual-p" type="number" min="0" step="0.1" placeholder="г" />
            </div>
            <div>
              <label for="${mealId}-${slotId}-manual-f">Жиры на 100 г</label>
              <input id="${mealId}-${slotId}-manual-f" type="number" min="0" step="0.1" placeholder="г" />
            </div>

              <label for="${mealId}-${slotId}-manual-c">Углеводы на 100 г</label>

            </div>

            <button type="button" onclick="addMealManualEntry('${mealId}', '${slotId}')">Добавить вручную</button>
            <button type="button" class="btn-clear" onclick="closeMealManual('${mealId}', '${slotId}')">Отмена</button>
          </div>
          <div id="${mealId}-${slotId}-manual-error" class="notfound"></div>
        </div>
      </div>
    </div>
  `;
}
function buildBreakfastSlotRow(slotId){
  return buildMealSlotRow("breakfast", slotId);
}
function getMealHeaderIconImg(mealId){
  const icons = {
    breakfast: "icons/breakfast-icon.png",
    lunch: "icons/lunch-icon.png",
    snack: "icons/snack-icon.png",
    dinner: "icons/dinner-icon.png"
  };
  const src = icons[mealId] || icons.breakfast;
  return `<img src="${src}" alt="" class="meal-card-meal-icon-img" width="56" height="56" decoding="async" />`;
}
function buildMealCard(mealId){
  const isOpen = isMealCardOpen(mealId);
  const slotsHtml = SLOTS.map(slotId => buildMealSlotRow(mealId, slotId)).join("");
  const card = document.createElement("article");
  card.className = isOpen ? "meal-card is-open" : "meal-card";
  card.id = "meal-" + mealId;
  card.innerHTML = `
    <button type="button" class="meal-card-header" onclick="toggleMealCard('${mealId}')" aria-expanded="${isOpen}">
      <span class="meal-card-header-main">
        <span class="meal-card-meal-icon" aria-hidden="true">${getMealHeaderIconImg(mealId)}</span>
        <span class="meal-card-header-text">
          <span class="meal-card-title">${MEAL_LABELS[mealId]}</span>
          <span class="meal-card-summary" id="meal-${mealId}-summary"></span>
        </span>
      </span>
      <span class="meal-card-chevron" aria-hidden="true">▼</span>
    </button>
    <div class="meal-card-body">
      <div class="meal-time-row">
        <div class="meal-time-label">🕒 Время приёма пищи</div>
        ${buildMealTimePickerHtml(mealId)}
      </div>
      <div id="${mealId}-legacy-block" class="breakfast-legacy-block" style="display:none"></div>
      <div class="breakfast-slots">${slotsHtml}</div>
      <div class="meal-totals-wrap">
        <div class="meal-totals-title">${MEAL_TOTALS_LABEL[mealId]}</div>
        <div class="summary meal-totals">
          <div class="box">Ккал<span id="${mealId}-total-cal">0</span></div>
          <div class="box">Белки<span id="${mealId}-total-prot">0 г</span></div>
          <div class="box">Жиры<span id="${mealId}-total-fat">0 г</span></div>
          <div class="box">Углеводы<span id="${mealId}-total-carbs">0 г</span></div>
        </div>
      </div>
      <div class="meal-feeling-row">
        <label class="meal-feeling-label" for="meal-${mealId}-feeling">Любое физическое ощущение во время и после еды</label>
        <textarea id="meal-${mealId}-feeling" placeholder="Например: сытость, тяжесть, энергичность, сонливость..." oninput="saveMealFeeling('${mealId}')"></textarea>
      </div>
    </div>
  `;
  return card;
}
function buildBreakfastCard(){
  return buildMealCard("breakfast");
}
function buildMealCards(){
  const container = document.getElementById("mealCards");
  if(!container) return;
  container.innerHTML = "";
  MEALS.forEach(mealId => {
    container.appendChild(buildMealCard(mealId));
  });
}

function normalize(str){ return str.trim().toLowerCase().replace(/ё/g,"е"); }
initFoodDB();
loadDiary();
migrateLegacyItems();

renderAllMealCards();
renderDiaryPanel();
